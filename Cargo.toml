[package]
name = "superline"
version = "0.20.2"
authors = ["alxhill <me@alxhill.com>", "cirho <me@cirho.com>"]
edition = "2021"
description = "Configurable Powerline implementation in pure Rust."
license = "MIT"
repository = "https://github.com/alxhill/superline"
readme = "README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
hostname = "0.3"
if-addrs = "0.15"
battery = { package = "starship-battery", version = "0.11.1" }
# Pure-Rust git backend, used in-process for small working trees (see
# `src/modules/git.rs`). `status`/`revision` cover the status walk and the
# ahead/behind commit counting; `max-performance-safe` keeps the speedups while
# avoiding any C toolchain (gix decompresses objects with zlib-rs).
gix = { version = "0.84", default-features = false, features = [
    "sha1",
    "status",
    "revision",
    "max-performance-safe",
] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
thiserror = "1.0.61"
clap = { version = "4.5.7", features = ["derive"] }
chrono = "0.4.38"
fs2 = "0.4"
portable-pty = "0.9.0"
regex = "1"
unicode-width = "0.2"
# Verifies `superline upgrade` downloads. 0.10 shares its `digest` with the
# `sha1` that gix already pulls in.
sha2 = "0.10"
# HTTPS for the update check and `superline upgrade` (see `src/http.rs`).
# rustls does TLS over ring's crypto: the pure-Rust providers are either alpha
# (rustls-rustcrypto) or need AVX2 (graviola), which the musl build must not.
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "platform-verifier",
] }
# Unpack release archives. `zlib-rs` is the inflate backend gix already uses.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4.46", default-features = false }

# Unix-only: the `users` crate wraps libc's passwd/uid APIs, and `libc::access`
# powers the read-only check. Windows uses the env-var / std fallbacks in
# `platform.rs` instead.
[target.'cfg(unix)'.dependencies]
users = "0.11"
libc = "0.2"

# PowerShell renders the prompt by launching `superline show` as a native
# console process. Ignore Windows console Ctrl-C events in that short-lived
# renderer so an interrupt intended for the previous command cannot make the
# custom prompt return no output and fall back to `PS>`.
[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"

# Terminal snapshot tests run superline in real shells through VHS, and double
# as the `sl-test` helper those shells call, so they bring their own `main`.
[[test]]
name = "terminal_snapshots"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = "debuginfo"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
codegen-units = 1
opt-level = 3
