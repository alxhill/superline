name: Release-plz

on:
  push:
    branches:
      - main

# Avoid two release-plz runs racing on overlapping git history.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish any unreleased versions to crates.io and create the GitHub release.
  # Uses crates.io Trusted Publishing (OIDC) via `id-token: write` - no
  # CARGO_REGISTRY_TOKEN secret is needed. release-plz performs the OIDC token
  # exchange itself. Note: the very first publish of a crate must be done
  # manually; trusted publishing only works once the crate exists on crates.io.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-plz.outputs.releases_created }}
      version: ${{ steps.release-metadata.outputs.version }}
      tag: ${{ steps.release-metadata.outputs.tag }}
    # Runs in the `cargo` deployment environment - the crates.io trusted
    # publisher is scoped to this environment name, so the OIDC token is only
    # accepted for jobs that declare it.
    environment: cargo
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release metadata
        if: steps.release-plz.outputs.releases_created == 'true'
        id: release-metadata
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version=$(jq -r '.[] | select(.package_name == "superline") | .version' <<<"$RELEASES")
          tag=$(jq -r '.[] | select(.package_name == "superline") | .tag' <<<"$RELEASES")
          test -n "$version"
          test -n "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Prebuilt binaries attached to the GitHub release. Two consumers depend on
  # the names produced here: `cargo binstall superline` resolves them from the
  # `[package.metadata.binstall]` URL template in Cargo.toml, and the Homebrew
  # tap downloads the aarch64-apple-darwin tarball to compute its checksum. Each
  # archive holds the bare binary at its root - no versioned directory.
  release-assets:
    name: Build ${{ matrix.target }}
    needs: release-plz-release
    if: needs.release-plz-release.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One unbuildable target should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            # Every Apple silicon Mac is an M1 or later, so this baseline costs
            # no compatibility.
            rustflags: -Ctarget-cpu=apple-m1
          - target: x86_64-apple-darwin
            os: macos-latest
            rustflags: ""
          # Built on the oldest supported runner image so the binary does not
          # require a newer glibc than the distro the user is on.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            rustflags: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            rustflags: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: ""
    env:
      # `.cargo/config.toml` compiles for the host CPU, which is wrong for a
      # binary other people download (and impossible when cross-compiling).
      # RUSTFLAGS takes precedence over the config file, so setting it here -
      # empty for most targets - is what disables that.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-plz-release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.release-plz-release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          bin=superline
          if [[ "$TARGET" == *windows* ]]; then
            bin=superline.exe
          fi
          asset="superline-${VERSION}-${TARGET}.tar.gz"
          tar -czf "$asset" -C "target/${TARGET}/release" "$bin"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  # RELEASE_PLZ_TOKEN has access to both this repository and the Homebrew tap,
  # so the newly uploaded binary can update the formula immediately. Gated on
  # the whole matrix: a release with missing binaries is a release to fix before
  # pointing the tap at it.
  homebrew-formula:
    name: Update Homebrew formula
    needs: [release-plz-release, release-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          VERSION: ${{ needs.release-plz-release.outputs.version }}
        run: |
          gh workflow run update.yml \
            --repo alxhill/homebrew-superline \
            --ref main \
            --field version="$VERSION"

  # Open/update the "release" PR that bumps the version and updates the
  # changelog based on the conventional commits merged since the last release.
  #
  # This job needs a token that is NOT `secrets.GITHUB_TOKEN`. GitHub refuses to
  # start workflow runs for events raised by `GITHUB_TOKEN` - a recursion guard -
  # so a release PR opened with it gets no CI and cannot satisfy the required
  # checks on `main` without someone pressing "Approve and run" by hand.
  # `RELEASE_PLZ_TOKEN` is a non-expiring fine-grained PAT with Contents and Pull
  # requests read/write, which makes the PR look like it came from a real account
  # so `pull_request` fires normally. Deliberately no `|| GITHUB_TOKEN` fallback:
  # if the secret is ever missing this job fails loudly, rather than quietly
  # going back to a release PR that nobody notices has no CI.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Queue the release PR to merge itself once CI is green, so cutting a
      # release needs no clicks at all. `--auto` merges straight away if the
      # checks have already passed.
      #
      # This must use `RELEASE_PLZ_TOKEN` rather than `GITHUB_TOKEN`, for the
      # same reason the PR itself does: merging pushes to `main`, and a push
      # made by `GITHUB_TOKEN` would not start the `release` job above - the
      # release PR would merge and then silently never publish.
      - name: Queue the release PR to auto-merge
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: gh pr merge --squash --auto --repo '${{ github.repository }}' "$(jq -r .number <<<"$PR")"
