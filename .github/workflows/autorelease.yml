name: Autorelease

# Adding the `autorelease` label to an open release-plz PR queues it to merge
# once CI is green. `release-plz.yml` does the same on pushes to `main`, but
# only sees a label that was already on the PR; this covers labelling a PR
# after it has been opened.
#
# `pull_request_target` rather than `pull_request`: the run uses this file as it
# exists on `main`, not whatever the PR branch carries, and is not part of the
# PR's own CI. Nothing from the PR is checked out or executed.
on:
  pull_request_target:
    types:
      - labeled

jobs:
  queue-merge:
    name: Queue labelled release PR to auto-merge
    if: >-
      github.event.label.name == 'autorelease' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      # `RELEASE_PLZ_TOKEN` for the same reason as in `release-plz.yml`: a merge
      # made by `GITHUB_TOKEN` pushes to `main` without starting the release
      # job, so the PR would merge and never publish.
      - name: Queue the release PR to auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --squash --auto --repo "$REPO" "$NUMBER"
