name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Local builds target the host CPU via .cargo/config.toml. GitHub's target
  # cache can be restored on a runner with a different CPU, so keep CI artifacts
  # portable to avoid STATUS_ILLEGAL_INSTRUCTION when loading cached binaries.
  RUSTFLAGS: ""

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-portable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  release-assets:
    name: Release assets (dry run)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/release-assets.yml

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-portable

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Both git backends (CLI and gitoxide) compile in by default and are
      # picked at runtime by the `git` module's `backend` config.
      - name: Build
        run: cargo build --verbose

      # Runs the unit tests plus the real-`pwsh` end-to-end prompt test
      # (PowerShell 7 is preinstalled on windows-latest).
      - name: Test
        run: cargo test --verbose
